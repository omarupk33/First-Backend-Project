<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { line-height: 1.6; color: #333; background-color: #fdfdfd; }
        .container { max-width: 1100px; margin: 0 auto; padding: 80px 20px; }
        .about-section { display: flex; align-items: center; gap: 50px; flex-wrap: wrap; }
        .about-content { flex: 1; min-width: 300px; }
        .about-img { flex: 1; min-width: 300px; text-align: center; }
        .about-img img { max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 2.8rem; color: #1a1a1a; margin-bottom: 20px; }
        .subtitle { font-size: 1.2rem; color: #666; margin-bottom: 20px; font-weight: 500; }
        p { margin-bottom: 20px; color: #555; }
        .btn { display: inline-block; padding: 12px 30px; background-color: #007bff; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold; transition: background 0.3s ease; }
        .btn:hover { background-color: #0056b3; }
        @media (max-width: 768px) { .about-section { flex-direction: column; text-align: center; } }
    </style>

</head>
<body>

    <div class="contact-container">
        <h2>Get in Touch</h2>
        <p>We'll get back to you as soon as possible.</p>
        
        <form action="#" method="POST" class="contact-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="How can we help?">
            </div>
            
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>

</body>
</html>
